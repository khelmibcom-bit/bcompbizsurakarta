        - generic [ref=e283]:
          - button "Apa itu Bcompbiz?" [ref=e284]
          - paragraph [ref=e288]: Bcompbiz adalah studio pengembangan perangkat lunak dari Indonesia yang berfokus pada pembuatan solusi digital inovatif berbasis kecerdasan buatan (AI). Kami membangun produk-produk seperti Family Health AI dan Ahli Investasi.
        - generic [ref=e289]:
          - button "Teknologi apa yang digunakan Bcompbiz?" [ref=e290]
          - paragraph [ref=e294]: Kami menggunakan stack modern seperti Next.js, React, TypeScript, Tailwind CSS, Prisma ORM, PostgreSQL, dan berbagai AI engine (Gemini, Claude, OpenAI, Grok). Semua produk kami dibangun dengan standar industri tertinggi.
        - generic [ref=e295]:
          - button "Apakah Family Health AI bisa digunakan gratis?" [ref=e296]
          - paragraph [ref=e300]: Ya, Family Health AI menyediakan akses gratis sebagai pengguna tamu. Anda juga bisa login dengan Google untuk menyimpan data kesehatan dan mendapatkan analisis yang lebih personal.
        - generic [ref=e301]:
          - button "Apakah Ahli Investasi tersedia di mobile?" [ref=e302]
          - paragraph [ref=e306]: Ya, Ahli Investasi tersedia sebagai aplikasi Android melalui Capacitor. Aplikasi ini sedang dalam proses review untuk Play Store.
        - generic [ref=e307]:
